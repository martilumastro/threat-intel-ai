[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-intel-ai"
version = "0.1.0"
description = "Local, modular pipeline for threat intelligence extraction and correlation."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0", 
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "actor_aliases",
    "common",
    "step1_extraction",
    "step2_correlation",
    "generate_test_documents",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"
