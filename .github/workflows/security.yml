name: Security & Quality Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install project and tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit ruff detect-secrets pytest
          pip install -e .

      - name: 1. Run Ruff (Code quality and syntax)
        run: ruff check .

      - name: 2. Run Unit Tests
        run: pytest

      - name: 3. Run Bandit (Static Application Security Testing - SAST)
        run: bandit -r src/

      - name: 4. Run pip-audit (Dependency vulnerability scan)
        run: pip-audit

      - name: 5. Check for exposed secrets
        run: detect-secrets scan
